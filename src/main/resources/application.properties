spring.application.name=casino-project

server.port=8082

# .env у корені проєкту підхоплюється автоматично (якщо змінні не задані в IDE)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**

# Ключ AES-256 у base64 (32 байти). Для продакшну обов'язково свій через CASINO_ENCRYPTION_KEY.
casino.crypto.key=${CASINO_ENCRYPTION_KEY:q1c2Vb9xJ0mXKk6l3Q3b5N7rT2wYfE8uA4sD6gH1jZo=}
# Секрет, яким фейковий платіжний шлюз підписує відповіді (HMAC-SHA256)
casino.payment.hmac-secret=${CASINO_PAYMENT_SECRET:dev-payment-secret-change-me}
casino.payment.max-single-amount=10000

# Захист банку: один виграш не може перевищувати меншого з двох значень
casino.house.max-win-share=0.05
casino.house.max-win-absolute=5000

casino.admin.username=${CASINO_ADMIN_USERNAME:admin}
casino.admin.email=${CASINO_ADMIN_EMAIL:admin@casino.local}
casino.admin.password=${CASINO_ADMIN_PASSWORD:admin12345}
