<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Реєстрація')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container narrow auth">
    <div class="card">
        <h1>Реєстрація</h1>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/register}" th:object="${form}" method="post" class="form">
            <label>Логін
                <input type="text" th:field="*{username}" required>
                <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </label>
            <label>Email
                <input type="email" th:field="*{email}" required>
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </label>
            <label>Пароль
                <input type="password" th:field="*{password}" required>
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </label>
            <label>Повторіть пароль
                <input type="password" th:field="*{confirmPassword}" required>
            </label>
            <button type="submit" class="btn">Створити акаунт</button>
        </form>
        <p class="small muted auth-footer">Вже маєте акаунт? <a th:href="@{/login}">Увійти</a></p>
    </div>
</main>
</body>
</html>
