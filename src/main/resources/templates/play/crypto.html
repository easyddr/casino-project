<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${game.name})}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container" id="game" th:data-game-id="${game.id}">
    <a class="back-link" th:href="@{/}">← Усі ігри</a>
    <h1 th:text="${game.name}">Crypto Trader</h1>
    <p class="muted" th:text="${game.description}"></p>

    <div class="card">
        <div class="ticker">
            <span class="coin-tag"><span class="live-dot"></span>CASINOCOIN</span>
            <span>Ціна: <b id="price">1.0000</b></span>
            <span>Вартість позиції: <b id="value">0.00</b></span>
        </div>
        <canvas id="chart" width="900" height="320"></canvas>
        <div id="message" class="message center">Купіть монету і продайте дорожче. Але ринок може обвалитись будь-якої миті.</div>
        <div class="bet-bar">
            <input type="number" id="amount" th:min="${game.minBet}" th:max="${game.maxBet}" step="0.01" th:value="${game.minBet}">
            <button id="buy" class="btn">Купити</button>
            <button id="sell" class="btn danger" disabled>Продати</button>
        </div>
        <p class="small muted center">При продажу біржа бере комісію 3%. Ставка від <span th:text="${game.minBet}"></span>
            до <span th:text="${game.maxBet}"></span>.</p>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/crypto.js}"></script>
</body>
</html>
