<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${game.name})}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container narrow" id="game" th:data-game-id="${game.id}">
    <a class="back-link" th:href="@{/}">← Усі ігри</a>
    <h1 th:text="${game.name}">Dice</h1>
    <p class="muted" th:text="${game.description}"></p>

    <div class="card center">
        <div id="roll" class="big-number">--.--</div>
        <div id="message" class="message">Оберіть шанс і зробіть ставку</div>

        <label class="slider">
            <span>Шанс виграшу: <b id="chanceLabel">50</b>%</span>
            <input type="range" id="chance" min="2" max="95" value="50">
        </label>
        <div class="dice-metrics">
            <span>Множник <b id="multiplier">x1.92</b></span>
            <span>Виграш якщо менше <b id="target">50.00</b></span>
        </div>

        <div class="bet-bar">
            <input type="number" id="amount" th:min="${game.minBet}" th:max="${game.maxBet}" step="0.01" th:value="${game.minBet}">
            <button id="rollBtn" class="btn">Кинути</button>
        </div>
        <p class="small muted" th:text="'Ставка від ' + ${game.minBet} + ' до ' + ${game.maxBet}"></p>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/dice.js}"></script>
</body>
</html>
